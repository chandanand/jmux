# jmux tmux configuration loader
#
# Source order:
#   1. jmux defaults — opinionated keybindings, colors, status bar
#   2. The user's tmux config, if jmux resolved one — overrides defaults
#   3. jmux core — required settings that jmux depends on (sourced last, wins)
#
# Users can override any default in their own tmux config. Only core settings
# (mouse, detach-on-destroy, status off, window naming) cannot be overridden.

# Step 1: jmux defaults (baseline)
source-file "$JMUX_DIR/config/defaults.conf"

# Step 2: the user's config (overrides defaults)
#
# Which file — ~/.tmux.conf, $XDG_CONFIG_HOME/tmux/tmux.conf, one the user
# named, or none at all — is decided by `userTmuxConfig` in jmux's config.json
# and resolved in src/tmux-user-config.ts, which exports the answer here as
# $JMUX_USER_CONF. Empty means source nothing.
#
# Deciding in TypeScript rather than in tmux is what makes the fallback order
# and the off switch testable; this file gets one unambiguous path or nothing.
# -q covers the window between that existence check and tmux reading the file —
# a path that was configured and is absent is reported by jmux, where there is
# a human to tell.
#
# `if-shell` without -b blocks the command queue until its shell exits, so
# step 3 still lands last. Do not background it.
if-shell '[ -n "$JMUX_USER_CONF" ]' 'source-file -q "$JMUX_USER_CONF"'

# Step 3: jmux core (non-negotiable — must be last)
source-file "$JMUX_DIR/config/core.conf"
