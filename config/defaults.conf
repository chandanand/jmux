# jmux default configuration
# Opinionated defaults — override anything here via ~/.tmux.conf

unbind p  # handled by jmux InputRouter directly

# --- Windows ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g allow-rename off
set -g automatic-rename-format "#{b:pane_current_path}"
bind c new-window -c ~
bind -n C-Right next-window
bind -n C-Left previous-window

# Reorder windows with Ctrl-Shift-Left/Right
bind-key -n C-S-Left run-shell 'W=#{window_index}; T=$((W-1)); [ $T -ge 1 ] && tmux swap-window -s ":$W" -t ":$T" && tmux select-window -t ":$T"'
bind-key -n C-S-Right run-shell 'W=#{window_index}; T=$((W+1)); MAX=$(tmux list-windows | wc -l | tr -d " "); [ $T -le $MAX ] && tmux swap-window -s ":$W" -t ":$T" && tmux select-window -t ":$T"'

# --- Panes ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5
# Vim-style aliases: lowercase movement is routed by jmux so it can cross into
# the info panel and Command Center; uppercase stays in tmux for repeatable
# resizing. Arrow bindings remain available as compatibility aliases.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Smart-splits.nvim integration
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n S-Left if-shell "$is_vim" "send-keys S-Left" "select-pane -L"
bind -n S-Right if-shell "$is_vim" "send-keys S-Right" "select-pane -R"
bind -n S-Up if-shell "$is_vim" "send-keys S-Up" "select-pane -U"
bind -n S-Down if-shell "$is_vim" "send-keys S-Down" "select-pane -D"

# --- Pane borders ---
#
# Titles off, everywhere, including split windows.
#
# They used to switch on the moment a window held more than one pane, on the
# theory that a border row earns its place by telling panes apart. It doesn't:
# the line between two panes already does that, and the title row costs a line
# of every pane's height plus a rule across the top of the window — visible
# chrome, permanently, to name commands you can see running.
#
# jmux's own toolbar names the window and the sidebar names the session, so a
# per-pane title is a third label for a screen that already has two. The format
# below is kept because it is the right one *if* you want titles: it names the
# running command rather than the path, so it stays complementary to the tab.
# Turn them on in ~/.tmux.conf with:
#
#   set -g pane-border-status top
#
set -g pane-border-lines heavy
set -g pane-border-status off
set -g pane-border-style 'fg=#3a4450'
set -g pane-active-border-style 'fg=#4f565d'
set -g pane-border-format "#{?pane_active, #[fg=#9fe8c3 bold]#{pane_current_command} , #[fg=#4f565d]#{pane_current_command} }"

# --- Window styles ---
set -g window-style 'fg=#6b7280'
set -g window-active-style 'fg=#b5bcc9'

# --- Utilities ---
bind C-l send-keys -R \; clear-history \; display-message "Pane cleared"
# $JMUX_COPY is resolved per-platform and exported by jmux (see src/platform.ts).
# Empty means no clipboard tool was found, which is a message rather than a
# silent no-op — the old bind hardcoded pbcopy and did nothing at all on Linux.
bind y run-shell 'if [ -n "$JMUX_COPY" ]; then tmux capture-pane -pS - -E - | grep . | $JMUX_COPY && tmux display-message "Copied pane to clipboard"; else tmux display-message "No clipboard tool found — install wl-clipboard or xclip"; fi'

# Rename session, move window and settings are reached through the command
# palette (C-Space p). They were bound to display-popup shell scripts here until
# those scripts moved into modals; the binds outlived the scripts by months.

# --- Terminal ---
set -g default-terminal "tmux-256color"
set -g set-clipboard on
# Let a program in a pane push escape sequences tmux doesn't model — in
# practice, kitty graphics. jmux lifts those back out of the PTY stream and
# relays them to the real terminal (src/images/passthrough.ts), so an image
# drawn in a pane actually appears. This lives here rather than in core.conf
# because jmux does not need it to function: turn it off and panes simply stop
# drawing pictures.
set -g allow-passthrough on
set -g focus-events on
set -g mouse on
set -gq status-utf8 on
set-window-option -gq utf8 on
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set-option -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -ga terminal-features ",*:hyperlinks"

# --- Bell / Activity ---
set-window-option -g visual-bell off
set-window-option -g bell-action other
set-window-option -g monitor-activity off
set-window-option -g visual-activity off
set-hook -g pane-focus-in 'setw monitor-bell off; setw monitor-bell on'
unbind -T root DoubleClick1Pane
unbind -T root TripleClick1Pane

# --- Status bar ---
# Minimal — session indicator handled by jmux sidebar, no system metrics
set -g status-position bottom
set -g status-interval 1
set -g status-justify left
set -g status-bg "#181f26"
set -g status-left ""
set -g status-right ""
set -g status-left-length 0
set -g status-right-length 0

# Window tabs
setw -g window-status-current-format "#[bg=#181f26 fg=#fbd4b8]◢#[bg=#fbd4b8 fg=#131a21] #W #{?window_zoomed_flag,󰊓 ,}#[bg=#181f26 fg=#fbd4b8]◣"
setw -g window-status-format "#{?window_bell_flag,#[bg=#181f26 fg=#ced4df] #W #{?window_zoomed_flag,󰊓 ,},#[bg=#181f26 fg=#4f565d] #W #{?window_zoomed_flag,󰊓 ,}}"
set -g window-status-bell-style 'fg=#ced4df,bg=#0c1117'
set -g window-status-activity-style 'fg=#b5bcc9,bg=#4e555c,bold'
